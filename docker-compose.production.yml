services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bolaocerto}
      POSTGRES_USER: ${POSTGRES_USER:-bolaocerto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bolaocerto} -d ${POSTGRES_DB:-bolaocerto}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bolaocerto}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
      PGDATABASE: ${POSTGRES_DB:-bolaocerto}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ENV_LABEL: ${ALERT_ENV_LABEL:-BL}
    volumes:
      - backup_data:/backups
      - uploads_data:/uploads:ro
      - ./infra/backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN obrigatoria}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET obrigatoria}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET obrigatoria}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CAIXA_API_BASE_URL: ${CAIXA_API_BASE_URL:-https://servicebus2.caixa.gov.br/portaldeloterias/api}
      CAIXA_API_TIMEOUT_MS: ${CAIXA_API_TIMEOUT_MS:-15000}
      CAIXA_FALLBACK_BASE_URL: ${CAIXA_FALLBACK_BASE_URL:-}
      CAIXA_USER_AGENT: ${CAIXA_USER_AGENT:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      PAYMENT_TEST_MODE: ${PAYMENT_TEST_MODE:-false}
      PAYMENT_API_BASE_URL: ${PAYMENT_API_BASE_URL:-https://api-sandbox.asaas.com/api/v3}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      CORA_ENV: ${CORA_ENV:-stage}
      CORA_CLIENT_ID: ${CORA_CLIENT_ID:-}
      CORA_CERT_BASE64: ${CORA_CERT_BASE64:-}
      CORA_KEY_BASE64: ${CORA_KEY_BASE64:-}
      CORA_CERT_PEM: ${CORA_CERT_PEM:-}
      CORA_KEY_PEM: ${CORA_KEY_PEM:-}
      CORA_MIN_AMOUNT: ${CORA_MIN_AMOUNT:-5}
      # Cartão: segundo provedor (Mercado Pago). Vazio = cartão desligado.
      CARD_PAYMENT_PROVIDER: ${CARD_PAYMENT_PROVIDER:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_SIGNATURE_SECRET: ${MERCADOPAGO_SIGNATURE_SECRET:-}
      MERCADOPAGO_MAX_INSTALLMENTS: ${MERCADOPAGO_MAX_INSTALLMENTS:-1}
      MERCADOPAGO_MIN_AMOUNT: ${MERCADOPAGO_MIN_AMOUNT:-5}
      # Contratos e identificação do operador (sem eles a API não aceita reservas).
      LEGAL_APPROVED_VERSION: ${LEGAL_APPROVED_VERSION:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_CNPJ: ${LEGAL_OPERATOR_CNPJ:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_REFUND_TERMS: ${LEGAL_REFUND_TERMS:-}
      LEGAL_AFFILIATE_PAYOUT_TERMS: ${LEGAL_AFFILIATE_PAYOUT_TERMS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PAYMENT_BOLETO_DUE_DAYS: ${PAYMENT_BOLETO_DUE_DAYS:-2}
      PAYMENT_BOLETO_MIN_HOURS_TO_CUTOFF: ${PAYMENT_BOLETO_MIN_HOURS_TO_CUTOFF:-96}
      NFSE_MODE: ${NFSE_MODE:-off}
      NFSE_ISS_PCT: ${NFSE_ISS_PCT:-}
      NFSE_SERVICE_CODE: ${NFSE_SERVICE_CODE:-}
      NFSE_CNAE: ${NFSE_CNAE:-}
      NFSE_MUNICIPAL_TAX_CODE: ${NFSE_MUNICIPAL_TAX_CODE:-}
      NFSE_DESCRIPTION: ${NFSE_DESCRIPTION:-Serviço de intermediação e administração de participação em bolão}
      NFSE_ISS_WITHHELD: ${NFSE_ISS_WITHHELD:-}
      NFSE_AUTO_SINCE: ${NFSE_AUTO_SINCE:-}
      NFSE_MUNICIPAL_REGISTER: ${NFSE_MUNICIPAL_REGISTER:-}
      NFSE_STATE_REGISTER: ${NFSE_STATE_REGISTER:-}
      NFSE_TAX_REGIME: ${NFSE_TAX_REGIME:-SIMPLES_NACIONAL}
      NFSE_SPECIAL_TAX_REGIME: ${NFSE_SPECIAL_TAX_REGIME:-NONE}
      NFSE_RPS_SERIAL: ${NFSE_RPS_SERIAL:-1}
      NFSE_RPS_LAST_NUMBER: ${NFSE_RPS_LAST_NUMBER:-1}
      NFSE_PROVIDER: ${NFSE_PROVIDER:-}
      NFSE_FOCUS_TOKEN: ${NFSE_FOCUS_TOKEN:-}
      NFSE_FOCUS_ENV: ${NFSE_FOCUS_ENV:-homologacao}
      NFSE_FOCUS_WEBHOOK_SECRET: ${NFSE_FOCUS_WEBHOOK_SECRET:-}
      NFSE_CNPJ: ${NFSE_CNPJ:-}
      NFSE_IBGE: ${NFSE_IBGE:-5300108}
      NFSE_TRIB_NACIONAL: ${NFSE_TRIB_NACIONAL:-}
      NFSE_TRIB_MUNICIPAL: ${NFSE_TRIB_MUNICIPAL:-}
      NFSE_SIMPLES_OPCAO: ${NFSE_SIMPLES_OPCAO:-3}
      NFSE_SIMPLES_PCT: ${NFSE_SIMPLES_PCT:-0}
      NFSE_NBS: ${NFSE_NBS:-}
      NFSE_INDICADOR_OPERACAO: ${NFSE_INDICADOR_OPERACAO:-}
      NFSE_IBS_CBS_CST: ${NFSE_IBS_CBS_CST:-}
      NFSE_IBS_CBS_CLASS: ${NFSE_IBS_CBS_CLASS:-}
      NFSE_IBS_CBS_ENVIAR: ${NFSE_IBS_CBS_ENVIAR:-}
      RECEIPT_SECRET: ${RECEIPT_SECRET:-}
      CRM_NIVEL_PRATA: ${CRM_NIVEL_PRATA:-1000}
      CRM_NIVEL_OURO: ${CRM_NIVEL_OURO:-5000}
      CRM_NIVEL_DIAMANTE: ${CRM_NIVEL_DIAMANTE:-20000}
      CRM_INATIVO_DIAS: ${CRM_INATIVO_DIAS:-90}
      CRM_NOVO_DIAS: ${CRM_NOVO_DIAS:-30}
      CRM_RECORRENTE_MIN_BOLOES: ${CRM_RECORRENTE_MIN_BOLOES:-3}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ENV_LABEL: ${ALERT_ENV_LABEL:-BL}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      ADMIN_LOGIN_LOCK_ENABLED: ${ADMIN_LOGIN_LOCK_ENABLED:-true}
      MANDATO_TERM_HASH: ${MANDATO_TERM_HASH:?MANDATO_TERM_HASH obrigatoria}
      MANDATO_TERM_VERSION: ${MANDATO_TERM_VERSION:-2026-09-01}
      SHARE_RESERVATION_MINUTES: ${SHARE_RESERVATION_MINUTES:-15}
      CANCELAMENTO_PRAZO_DIAS: ${CANCELAMENTO_PRAZO_DIAS:-7}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?ADMIN_BOOTSTRAP_EMAIL obrigatoria}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD obrigatoria}
      ADMIN_BOOTSTRAP_CPF: ${ADMIN_BOOTSTRAP_CPF:?ADMIN_BOOTSTRAP_CPF obrigatoria}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      CAIXA_API_BASE_URL: ${CAIXA_API_BASE_URL:-https://servicebus2.caixa.gov.br/portaldeloterias/api}
      CAIXA_API_TIMEOUT_MS: ${CAIXA_API_TIMEOUT_MS:-15000}
      CAIXA_FALLBACK_BASE_URL: ${CAIXA_FALLBACK_BASE_URL:-}
      CAIXA_USER_AGENT: ${CAIXA_USER_AGENT:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-300000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ENV_LABEL: ${ALERT_ENV_LABEL:-BL}
      HISTORY_BACKFILL_DEPTH: ${HISTORY_BACKFILL_DEPTH:-400}
      HISTORY_BACKFILL_BATCH: ${HISTORY_BACKFILL_BATCH:-25}
      HISTORY_BACKFILL_PAUSE_MS: ${HISTORY_BACKFILL_PAUSE_MS:-250}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001/api/v1
      API_PROXY_URL: http://api:3001
      PLATFORM_TEST_MODE: ${PLATFORM_TEST_MODE:-false}
      PLATFORM_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      # Endereço público do site para o SEO (links canônicos, sitemap e compartilhamento); usa o mesmo WEB_ORIGIN da API.
      SITE_URL: ${WEB_ORIGIN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backup_data:
  uploads_data:
